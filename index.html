<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1C1B22;       /* Firefox dark-theme background */
    --panel: #2B2A33;    /* Firefox surface */
    --panel-hover: #38383D;
    --ink: #FBFBFE;
    --ink-dim: #B6B6BD;
    --line: #42414D;
    --accent: #FF7139;   /* Firefox orange */
    --accent-2: #9059FF; /* Firefox purple, used only in the glow */
    --badge-bg: #F5F5F7; /* neutral light backing so every favicon looks consistent */
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(ellipse 1200px 700px at 50% -10%, #232229 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 7vh 20px 50px;
  }
  /* ---- Clock / date ---- */
  #clock{
    font-family: 'JetBrains Mono', monospace;
    font-size: 3.6rem;
    font-weight: 500;
    line-height:1;
  }
  #date{
    font-size: 0.9rem;
    color: var(--ink-dim);
    margin-top: 10px;
    letter-spacing: 0.02em;
  }
  /* ---- Search bar ---- */
  #search-wrap{
    margin-top: 38px;
    width: min(680px, 92vw);
    position: relative;
  }
  #search{
    width: 100%;
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 14px 22px;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  #search:focus-within{
    border-color: transparent;
    box-shadow: 0 0 0 1.5px var(--accent), 0 4px 24px -4px rgba(255,113,57,.35), 0 4px 28px -6px rgba(144,89,255,.25);
  }
  #engine-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: none;
    cursor: pointer;
    overflow: hidden;
  }
  #engine-btn img{
    width: 26px; height: 26px;
    border-radius: 50%;
    display:block;
    background: var(--badge-bg);
    object-fit: contain;
  }
  #search input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 1rem;
  }
  #search input::placeholder{ color: var(--ink-dim); }
  /* ---- Engine dropdown ---- */
  #engine-dropdown{
    position: absolute;
    top: calc(100% + 8px);
    left: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    min-width: 190px;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,.5);
    display: none;
    z-index: 10;
  }
  #engine-dropdown.open{ display:block; }
  .engine-option{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    font-family:'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .engine-option:hover{ background: var(--panel-hover); }
  .engine-option img{
    width: 18px; height: 18px;
    border-radius: 5px;
    flex: 0 0 auto;
    background: var(--badge-bg);
    object-fit: contain;
  }
  .engine-option.active{ color: var(--accent); }
  /* ---- Translate language picker ---- */
  #lang-btn{
    display:none;
    align-items:center;
    justify-content:center;
    gap: 6px;
    flex: 0 0 auto;
    padding: 6px 12px 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-hover);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #lang-btn:hover{ border-color: var(--accent); background: var(--panel); }
  #lang-btn .chevron{
    font-size: 0.65rem;
    color: var(--ink-dim);
    transform: translateY(1px);
  }
  #search.translate-mode #lang-btn{ display:flex; }
  #lang-dropdown{
    position: absolute;
    top: calc(100% + 8px);
    right: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    min-width: 190px;
    max-height: 280px;
    overflow-y: auto;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,.5);
    display: none;
    z-index: 10;
  }
  #lang-dropdown.open{ display:block; }
  #lang-dropdown .lang-dropdown-title{
    font-family:'Inter', sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-dim);
    padding: 6px 10px 4px;
  }
  .lang-option{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 9px;
    cursor: pointer;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    font-family:'Inter', sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
  }
  .lang-option:hover{ background: var(--panel-hover); }
  .lang-option.active{ color: var(--accent); }
  .lang-divider{
    height: 1px;
    background: var(--line);
    margin: 6px 4px;
  }
  /* ---- Tile sections ---- */
  .tile-section{
    margin-top: 44px;
    width: min(700px, 92vw);
    text-align:center;
  }
  .tile-section h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-dim);
    margin: 0 0 16px;
  }
  .tile-row{
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    gap: 16px;
    max-width: 580px;
    margin: 0 auto;
  }
  .tile-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    width: 78px;
  }
  .tile{
    width: 64px;
    height: 64px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .tile:hover{
    background: var(--panel-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  /* Every icon sits on an identical light rounded badge, regardless of
     whether the source favicon is square, circular, or has odd padding —
     this is what keeps the tile row looking uniform. */
  .icon-badge{
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--badge-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex: 0 0 auto;
  }
  .icon-badge img{
    width: 24px;
    height: 24px;
    object-fit: contain;
    display:block;
  }
  .icon-badge span.fallback{
    font-family:'Fraunces', serif;
    font-weight:600;
    color: var(--accent);
    font-size: 1.05rem;
  }
  .tile-item .label{ font-size: 0.78rem; color: var(--ink-dim); }
  /* ---- List sections ---- */
  #lists{
    margin-top: 50px;
    width: min(700px, 92vw);
    display:flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
  }
  .list-section{ min-width: 180px; }
  .list-section h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }
  .list-section ul{
    list-style:none;
    margin:0;
    padding:0;
  }
  .list-section li{ margin-bottom: 6px; }
  .list-section a{
    color: var(--ink);
    text-decoration:none;
    font-size: 0.92rem;
    display:block;
    padding: 2px 0;
  }
  .list-section a:hover{ color: var(--accent); }
  /* ---- Currency widget (custom-built, fully themed — no embedded iframe) ---- */
  #currency-section{
    margin-top: 50px;
    width: min(700px, 92vw);
    text-align:center;
  }
  #currency-section h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-dim);
    margin: 0 0 16px;
  }
  #currency-widget-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 100%;
  }
  .cc-row{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .cc-field{
    display:flex;
    align-items:center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
  }
  .cc-field input{
    width: 110px;
    background:none;
    border:none;
    outline:none;
    color: var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size: 0.95rem;
    padding: 10px 12px;
  }
  .cc-field select{
    background: var(--panel-hover);
    border:none;
    border-left: 1px solid var(--line);
    outline:none;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    padding: 10px 10px;
    cursor:pointer;
  }
  .cc-field select:hover{ background: var(--panel); }
  #cc-swap{
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-hover);
    color: var(--ink-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size: 1rem;
    flex: 0 0 auto;
    transition: color .15s ease, border-color .15s ease, transform .2s ease;
  }
  #cc-swap:hover{ color: var(--accent); border-color: var(--accent); transform: rotate(180deg); }
  #cc-result{
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    color: var(--ink);
  }
  #cc-result .cc-currency{ color: var(--ink-dim); font-size: 1rem; margin-left: 4px; }
  #cc-meta{
    font-size: 0.75rem;
    color: var(--ink-dim);
  }
  #cc-meta a{ color: var(--ink-dim); }
</style>
</head>
<body>
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="search-wrap">
    <form id="search" action="#">
      <button type="button" id="engine-btn" aria-label="Choose search engine">
        <img id="engine-logo" src="https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=64" alt="DuckDuckGo">
      </button>
      <input id="search-input" type="text" placeholder="Search with DuckDuckGo…" autocomplete="off">
      <button type="button" id="lang-btn" aria-label="Choose translation language">
        <span id="lang-label">Into German</span><span class="chevron">▾</span>
      </button>
    </form>
    <div id="engine-dropdown"></div>
    <div id="lang-dropdown"></div>
  </div>
  <div id="tile-sections"></div>
  <div id="lists"></div>

  <div id="currency-section">
    <h2>Widgets</h2>
    <div id="currency-widget-card">
      <div class="cc-row">
        <div class="cc-field">
          <input id="cc-amount" type="number" value="1" min="0" step="any" inputmode="decimal">
          <select id="cc-from"></select>
        </div>
        <button type="button" id="cc-swap" aria-label="Swap currencies">⇄</button>
        <div class="cc-field">
          <input id="cc-amount-to" type="text" value="…" readonly>
          <select id="cc-to"></select>
        </div>
      </div>
      <div id="cc-result">…</div>
      <div id="cc-meta">Rates via <a href="https://frankfurter.dev" target="_blank" rel="noopener">frankfurter.dev</a> (European Central Bank data)</div>
    </div>
  </div>

<script>
  // ---------- Clock (24hr) & date ----------
  function pad(n){ return n.toString().padStart(2,'0'); }
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);
  function renderDate(){
    const now = new Date();
    const weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
    const month = now.toLocaleDateString(undefined, { month: 'long' });
    const day = now.getDate();
    const year = now.getFullYear();
    const dd = pad(day);
    const mm = pad(now.getMonth() + 1);
    document.getElementById('date').textContent =
      `${weekday} ${day} ${month} ${year} (${dd}/${mm}/${year})`;
  }
  renderDate();

  // ---------- Translate icon ----------
  // A small self-contained "Aあ" glyph badge so we're not pulling Google's
  // translate branding — same idea as a favicon but drawn ourselves.
  const translateIconSvg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
      <rect width="26" height="26" rx="8" fill="#FF7139"/>
      <text x="6" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="12" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.85">文</text>
    </svg>`;
  const translateIcon = 'data:image/svg+xml;utf8,' + encodeURIComponent(translateIconSvg);

  // ---------- Search engines ----------
  // Add/remove/edit engines here. `url` is everything before the query,
  // which gets URL-encoded and appended on submit.
  const engines = [
    { name: 'DuckDuckGo', logo: 'https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=64', url: 'https://duckduckgo.com/?q=' },
    { name: 'Wikipedia',  logo: 'https://www.google.com/s2/favicons?domain=en.wikipedia.org&sz=64', url: 'https://en.wikipedia.org/wiki/Special:Search?search=' },
    { name: 'Amazon',     logo: 'https://www.google.com/s2/favicons?domain=amazon.co.uk&sz=64',      url: 'https://www.amazon.co.uk/s?k=' },
    { name: 'YouTube',    logo: 'https://www.google.com/s2/favicons?domain=youtube.com&sz=64',       url: 'https://www.youtube.com/results?search_query=' },
    { name: 'duck.ai', logo: 'https://www.google.com/s2/favicons?domain=claude.ai&sz=64', url: 'https://duck.ai/chat?q=' },
    { name: 'Steam',      logo: 'https://www.google.com/s2/favicons?domain=store.steampowered.com&sz=64', url: 'https://store.steampowered.com/search?term=' },
    { name: 'IMDb',       logo: 'https://www.google.com/s2/favicons?domain=imdb.com&sz=64',          url: 'https://www.imdb.com/find/?q=' },
    { name: 'Google Maps',  logo: 'https://www.google.com/s2/favicons?domain=maps.google.com&sz=64', url: 'https://www.google.com/maps/search/?api=1&query=' },
    { name: 'Google Earth', logo: 'https://www.google.com/s2/favicons?domain=earth.google.com&sz=64', url: 'https://earth.google.com/web/search/' },
    { name: 'Translate',  logo: translateIcon, special: 'translate' },
    { name: 'Random Wheel', logo: 'https://www.google.com/s2/favicons?domain=spinitwheel.com&sz=64', url: 'https://www.spinitwheel.com/embed.html?entries=' },
  ];
  let currentEngine = engines[0];

  const engineBtn = document.getElementById('engine-btn');
  const engineLogo = document.getElementById('engine-logo');
  const engineDropdown = document.getElementById('engine-dropdown');
  const searchInput = document.getElementById('search-input');

  function setEngine(engine){
    currentEngine = engine;
    engineLogo.src = engine.logo;
    engineLogo.alt = engine.name;
    if(engine.special === 'translate'){
      document.getElementById('search').classList.add('translate-mode');
      searchInput.placeholder = 'Enter text to translate…';
    } else {
      document.getElementById('search').classList.remove('translate-mode');
      searchInput.placeholder = `Search with ${engine.name}…`;
    }
    renderDropdown();
  }

  function renderDropdown(){
    engineDropdown.innerHTML = '';
    engines.forEach(engine => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'engine-option' + (engine.name === currentEngine.name ? ' active' : '');
      const img = document.createElement('img');
      img.src = engine.logo;
      img.alt = '';
      const label = document.createElement('span');
      label.textContent = engine.name;
      btn.appendChild(img);
      btn.appendChild(label);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setEngine(engine);
        engineDropdown.classList.remove('open');
        searchInput.focus();
      });
      engineDropdown.appendChild(btn);
    });
  }
  renderDropdown();

  engineBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    engineDropdown.classList.toggle('open');
  });
  document.addEventListener('click', () => {
    engineDropdown.classList.remove('open');
  });
  engineDropdown.addEventListener('click', (e) => e.stopPropagation());

  // ---------- Translate: language list & picker ----------
  // English and German are pinned to the top; edit/add more below freely.
  const pinnedLanguages = ['English', 'German'];
  const otherLanguages = [
    'French', 'Spanish', 'Italian', 'Portuguese', 'Dutch', 'Polish',
    'Swedish', 'Norwegian', 'Danish', 'Finnish', 'Greek', 'Czech',
    'Hungarian', 'Romanian', 'Turkish', 'Russian', 'Ukrainian',
    'Arabic', 'Hindi', 'Chinese', 'Japanese', 'Korean',
  ].sort((a, b) => a.localeCompare(b));
  let targetLang = 'German';

  const langBtn = document.getElementById('lang-btn');
  const langLabel = document.getElementById('lang-label');
  const langDropdown = document.getElementById('lang-dropdown');

  function setTargetLang(lang){
    targetLang = lang;
    langLabel.textContent = `Into ${lang}`;
    renderLangDropdown();
  }

  function renderLangDropdown(){
    langDropdown.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'lang-dropdown-title';
    title.textContent = 'Translate into…';
    langDropdown.appendChild(title);
    pinnedLanguages.forEach(lang => langDropdown.appendChild(makeLangOption(lang)));
    const divider = document.createElement('div');
    divider.className = 'lang-divider';
    langDropdown.appendChild(divider);
    otherLanguages.forEach(lang => langDropdown.appendChild(makeLangOption(lang)));
  }

  function makeLangOption(lang){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lang-option' + (lang === targetLang ? ' active' : '');
    btn.textContent = lang;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setTargetLang(lang);
      langDropdown.classList.remove('open');
      searchInput.focus();
    });
    return btn;
  }
  setTargetLang(targetLang);

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langDropdown.classList.toggle('open');
  });
  document.addEventListener('click', () => {
    langDropdown.classList.remove('open');
  });
  langDropdown.addEventListener('click', (e) => e.stopPropagation());

  // ---------- Search submit ----------
  document.getElementById('search').addEventListener('submit', e => {
    e.preventDefault();
    const q = searchInput.value.trim();
    if(!q) return;
    if(currentEngine.special === 'translate'){
      const phrase = `Translate ${q} into ${targetLang}`;
      window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(phrase);
    } else {
      window.location.href = currentEngine.url + encodeURIComponent(q);
    }
  });

  // =====================================================================
  // EDIT YOUR SHORTCUTS HERE — this is the only place you need to touch.
  // type: 'tiles'  -> shows as square icon tiles (Quick Access, Google)
  // type: 'list'   -> shows as a plain text link list (Firefox, Placeholder)
  // =====================================================================
  const sections = [
    {
      title: 'Quick Acess',
      type: 'tiles',
      items: [
        { name: 'Notion',  url: 'https://app.notion.com/p/2do-33d8102aa8818027b495f01773273131' },
        { name: 'YouTube', url: 'https://www.youtube.com/' },
        { name: 'Music', url: 'https://www.youtube.com/playlist?list=PLHsQHIA5H1YfRymDtxaZNmG79NA8fUmeD' },
        { name: 'Reddit',  url: 'https://www.reddit.com/' },
        { name: 'NEPU', url: 'https://nepu.to' },
        { name: 'Watchlist', url: 'https://www.imdb.com/user/p.p425g2sl4do2gvaju62ypk5rj4/watchlist/' },
        { name: 'SteamDB: Wishlisted Games',   url: 'https://steamdb.info/sales/?displayOnly=Wishlist&sort=discount_desc' },
        { name: 'SteamDB: DLC for games',   url: 'https://steamdb.info/sales/?displayOnly=AllOwnedGamesDLC&min_discount=0&min_rating=0&min_reviews=0&sort=discount_desc' },
      ]
    },
    {
      title: 'Media',
      type: 'tiles',
      items: [
        { name: 'YouTube', url: 'https://www.youtube.com/' },
        { name: 'Music', url: 'https://www.youtube.com/playlist?list=PLHsQHIA5H1YfRymDtxaZNmG79NA8fUmeD' },
        { name: 'IMDB', url: 'https://www.imdb.com/' },
        { name: 'FMHY.net', url: 'https://fmhy.net/' },
        { name: 'NEPU', url: 'https://nepu.to' },
        { name: 'Pirate Bay', url: 'https://thepiratebay.org/index.html' },
        { name: 'Torrent Client', url: 'https://webtor.io/' },

      ]
    },
    {
      title: 'Social/Fun',
      type: 'tiles',
      items: [
        { name: 'Reddit',  url: 'https://www.reddit.com/' },
        { name: 'Steam',   url: 'https://store.steampowered.com/' },
        { name: 'WhatsApp', url: 'https://web.whatsapp.com/' },
        { name: 'Discord',  url: 'https://discord.com/channels/@me' },

  function faviconFor(url){
    try{
      const u = new URL(url);
      return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
    }catch(e){ return ''; }
  }
  function renderTileSection(section){
    const wrap = document.createElement('div');
    wrap.className = 'tile-section';
    const h2 = document.createElement('h2');
    h2.textContent = section.title;
    wrap.appendChild(h2);
    const row = document.createElement('div');
    row.className = 'tile-row';
    section.items.forEach(item => {
      const itemWrap = document.createElement('div');
      itemWrap.className = 'tile-item';
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = item.url;
      const badge = document.createElement('div');
      badge.className = 'icon-badge';
      const img = document.createElement('img');
      img.src = faviconFor(item.url);
      img.alt = '';
      img.onerror = () => {
        img.remove();
        const fallback = document.createElement('span');
        fallback.className = 'fallback';
        fallback.textContent = item.name.charAt(0).toUpperCase();
        badge.appendChild(fallback);
      };
      badge.appendChild(img);
      a.appendChild(badge);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = item.name;
      itemWrap.appendChild(a);
      itemWrap.appendChild(label);
      row.appendChild(itemWrap);
    });
    wrap.appendChild(row);
    return wrap;
  }
  function renderListSection(section){
    const wrap = document.createElement('div');
    wrap.className = 'list-section';
    const h2 = document.createElement('h2');
    h2.textContent = section.title;
    wrap.appendChild(h2);
    const ul = document.createElement('ul');
    section.items.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.textContent = item.name;
      li.appendChild(a);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    return wrap;
  }
  const tileContainer = document.getElementById('tile-sections');
  const listContainer = document.getElementById('lists');
  sections.forEach(section => {
    if(section.type === 'tiles'){
      tileContainer.appendChild(renderTileSection(section));
    } else {
      listContainer.appendChild(renderListSection(section));
    }
  });

  // ---------- Currency converter (custom, themed, no embed) ----------
  // Uses frankfurter.dev — a free, no-key, CORS-enabled exchange rate API
  // backed by European Central Bank reference rates.
  const ccCurrencies = ['GBP','USD','EUR','JPY','CHF','CAD','AUD','NZD','CNY','INR','SEK','NOK','DKK','PLN','ZAR','SGD'];
  const ccAmount = document.getElementById('cc-amount');
  const ccAmountTo = document.getElementById('cc-amount-to');
  const ccFrom = document.getElementById('cc-from');
  const ccTo = document.getElementById('cc-to');
  const ccResult = document.getElementById('cc-result');
  const ccSwap = document.getElementById('cc-swap');

  function ccPopulateSelects(){
    ccCurrencies.forEach(code => {
      const optFrom = document.createElement('option');
      optFrom.value = code; optFrom.textContent = code;
      ccFrom.appendChild(optFrom);
      const optTo = document.createElement('option');
      optTo.value = code; optTo.textContent = code;
      ccTo.appendChild(optTo);
    });
    ccFrom.value = 'GBP';
    ccTo.value = 'EUR';
  }
  ccPopulateSelects();

  let ccDebounce;
  async function ccConvert(){
    const amount = parseFloat(ccAmount.value);
    const from = ccFrom.value;
    const to = ccTo.value;
    if(!amount || amount <= 0 || from === to){
      if(from === to && amount > 0){
        ccAmountTo.value = amount.toFixed(2);
        ccResult.innerHTML = `1 ${from} = 1.0000<span class="cc-currency">${to}</span>`;
      }
      return;
    }
    ccResult.textContent = 'Loading…';
    try{
      const res = await fetch(`https://api.frankfurter.dev/v1/latest?amount=${amount}&from=${from}&to=${to}`);
      const data = await res.json();
      const converted = data.rates[to];
      const unitRes = await fetch(`https://api.frankfurter.dev/v1/latest?amount=1&from=${from}&to=${to}`);
      const unitData = await unitRes.json();
      const unitRate = unitData.rates[to];
      ccAmountTo.value = converted.toFixed(2);
      ccResult.innerHTML = `1 ${from} = ${unitRate.toFixed(4)}<span class="cc-currency">${to}</span>`;
    }catch(err){
      ccResult.textContent = 'Rate unavailable';
    }
  }
  function ccScheduleConvert(){
    clearTimeout(ccDebounce);
    ccDebounce = setTimeout(ccConvert, 300);
  }
  ccAmount.addEventListener('input', ccScheduleConvert);
  ccFrom.addEventListener('change', ccConvert);
  ccTo.addEventListener('change', ccConvert);
  ccSwap.addEventListener('click', () => {
    const tmp = ccFrom.value;
    ccFrom.value = ccTo.value;
    ccTo.value = tmp;
    ccConvert();
  });
  ccConvert();
</script>
